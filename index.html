<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conteúdo Exclusivo - Scarface</title>

  <!-- METATAGS DO OPEN GRAPH E DO X (TWITTER) -->
  <meta property="og:title" content="Conteúdo Exclusivo - Scarface">
  <meta property="og:description" content="Clique para assistir ao vídeo completo com som.">
  <meta property="og:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  <meta property="og:url" content="https://morganalima945-web.github.io/teste1/">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Conteúdo Exclusivo - Scarface">
  <meta name="twitter:description" content="Clique para assistir ao vídeo completo com som.">
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Vídeo rodando fluido e adaptado para todas as telas */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }

    /* O botão começa invisível e surge suavemente */
    .cta-button {
      position: absolute;
      bottom: 10%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out;
      z-index: 10;
    }

    .btn-link {
      background: #ff0055;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      font-size: 15px;
      box-shadow: 0 4px 20px rgba(255, 0, 85, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-block;
      transition: transform 0.2s;
    }

    .btn-link:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <!-- Vídeo nativo configurado para iniciar automaticamente sem som e em loop -->
    <video id="meuVideo" autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos.
    </video>

    <!-- Botão de redirecionamento que aparece após 1.5 segundos -->
    <div id="cta" class="cta-button">
      <a href="https://scarfaceadamerica.netlify.app/" class="btn-link" target="_blank">
        ASSISTIR COMPLETO COM SOM ➔
      </a>
    </div>
  </div>

  <script>
    // Força o play via script caso o navegador mobile exija interação prévia
    document.addEventListener("DOMContentLoaded", function() {
      var v = document.getElementById("meuVideo");
      if (v) {
        v.play().catch(function(error) {
          console.log("Autoplay restrito, aguardando interação.");
        });
      }
    });

    // Revela o botão de CTA exatamente 1.5 segundos após o carregamento
    window.onload = function() {
      setTimeout(function() {
        var cta = document.getElementById('cta');
        if (cta) {
          cta.style.visibility = 'visible';
          cta.style.opacity = '1';
        }
      }, 1500);
    };
  </script>

</body>
</html>
