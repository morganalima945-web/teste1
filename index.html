<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clique para Assistir</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    .container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    
    /* O vídeo fica ao fundo */
    video { width: 100%; height: 100%; object-fit: cover; }

    /* O botão de "Play" centralizado */
    .play-button {
      position: absolute;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      border: 2px solid white;
      transition: transform 0.2s, background 0.2s;
      z-index: 10;
    }

    .play-button:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.4); }

    /* Triângulo do play */
    .triangle {
      width: 0; height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 35px solid white;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- O vídeo roda no fundo, mas não responde ao clique -->
    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- O link de redirecionamento está no botão central -->
    <a href="https://scarfaceadamerica.netlify.app/" class="play-button">
      <div class="triangle"></div>
    </a>
  </div>

</body>
</html>
