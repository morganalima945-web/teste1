<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo Exclusivo - Scarface</title>

  <!-- ADICIONE ESTAS METATAGS PARA O X ACEITAR O LINK -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Conteúdo Exclusivo - Scarface">
  <meta name="twitter:description" content="Clique para assistir ao vídeo completo.">
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .screen-center {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    .cta-wrapper {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .cta-wrapper:hover {
      transform: scale(1.05);
    }

    .play-circle {
      width: 90px;
      height: 90px;
      background: rgba(255, 0, 85, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
      margin-bottom: 15px;
      border: 2px solid #ffffff;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 25px solid #ffffff;
      margin-left: 5px;
    }

    .cta-text {
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="screen-center">
    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos.
    </video>

    <div class="overlay"></div>

    <a href="https://scarfaceadamerica.netlify.app/" class="cta-wrapper">
      <div class="play-circle">
        <div class="play-triangle"></div>
      </div>
      <div class="cta-text">CLIQUE PARA VER COMPLETO</div>
    </a>
  </div>

</body>
</html>
