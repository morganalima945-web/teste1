<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Conteúdo Exclusivo - Scarface</title>

  <!-- METATAGS DO X E OPEN GRAPH -->
  <meta property="og:title" content="Conteúdo Exclusivo - Scarface">
  <meta property="og:description" content="Clique para assistir ao vídeo completo.">
  <meta property="og:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  <meta property="og:url" content="https://morganalima945-web.github.io/teste1/">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Conteúdo Exclusivo - Scarface">
  <meta name="twitter:description" content="Clique para assistir ao vídeo completo.">
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* O link ocupa a tela inteira, garantindo que qualquer toque mande para o Netlify */
    .video-link-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Vídeo rodando em loop e mudo (único formato que o celular roda automático sem bloquear) */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Camada translúcida para dar destaque ao botão de play central */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 2;
    }

    /* Botão de Play centralizado que chama muita atenção sobre o vídeo rodando */
    .play-overlay-btn {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .play-circle {
      width: 85px;
      height: 85px;
      background: rgba(255, 0, 85, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
      margin-bottom: 15px;
      border: 2px solid #ffffff;
      animation: pulse 1.5s infinite;
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 24px solid #ffffff;
      margin-left: 4px;
    }

    .cta-text {
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      text-align: center;
    }

    /* Animação sutil de pulsar no botão para atrair o clique */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Tocar em qualquer lugar da tela (ou no botão) redireciona para o Netlify -->
  <a href="https://scarfaceadamerica.netlify.app/" class="video-link-wrapper">
    
    <!-- Vídeo rodando automaticamente de fundo -->
    <video autoplay muted loop playsinline webkit-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos.
    </video>

    <div class="overlay"></div>

    <!-- Botão centralizado pulsando sobre o vídeo em movimento -->
    <div class="play-overlay-btn">
      <div class="play-circle">
        <div class="play-triangle"></div>
      </div>
      <div class="cta-text">CLIQUE PARA ASSISTIR COM SOM</div>
    </div>

  </a>

  <script>
    // Força o play via JavaScript caso algum dispositivo tente pausar
    document.addEventListener("DOMContentLoaded", function() {
      var v = document.querySelector("video");
      if (v) {
        v.play().catch(function(e) { console.log("Autoplay handled"); });
      }
    });
  </script>

</body>
</html>
