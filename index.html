<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vídeo Exclusivo</title>

  <!-- METATAGS DO OPEN GRAPH E X (TWITTER) -->
  <meta property="og:title" content="Conteúdo Exclusivo - Scarface">
  <meta property="og:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Força o vídeo a se manter estritamente dentro da página web */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      outline: none;
    }

    /* Botão que aparece após 1.5 segundos para mandar para o Netlify */
    .cta-button {
      position: absolute;
      bottom: 8%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in-out;
      z-index: 10;
    }

    .btn-link {
      background: #ff0055;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      font-size: 15px;
      box-shadow: 0 4px 20px rgba(255, 0, 85, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- Player HTML5 limpo com os atributos de reprodução estritamente interna -->
    <video id="meuVideo" autoplay muted loop playsinline webkit-playsinline x5-playsinline preload="auto">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta a reprodução deste vídeo.
    </video>

    <!-- Botão revelado após 1.5 segundos -->
    <div id="cta" class="cta-button">
      <a href="https://scarfaceadamerica.netlify.app/" class="btn-link" target="_blank">
        ASSISTIR COMPLETO COM SOM ➔
      </a>
    </div>
  </div>

  <script>
    // Força o início imediato da reprodução interna via script
    window.addEventListener('DOMContentLoaded', function() {
      var video = document.getElementById('meuVideo');
      if (video) {
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(error) {
            console.log("Reprodução automática restrita pelo navegador.");
          });
        }
      }
    });

    // Revela o botão após 1.5 segundos
    window.onload = function() {
      setTimeout(function() {
        var cta = document.getElementById('cta');
        if (cta) {
          cta.style.visibility = 'visible';
          cta.style.opacity = '1';
        }
      }, 1500);
    };
  </script>

</body>
</html>
