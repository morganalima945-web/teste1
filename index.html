<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vídeo Exclusivo</title>

  <!-- METATAGS DO OPEN GRAPH -->
  <meta property="og:title" content="Conteúdo Exclusivo - Scarface">
  <meta property="og:type" content="video.other">
  <!-- A imagem precisa existir no código para o X não cancelar o card -->
  <meta property="og:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">

  <!-- METATAGS X (TWITTER) PLAYER CARD -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="Conteúdo Exclusivo - Scarface">
  <meta name="twitter:description" content="Assista ao vídeo exclusivo.">
  
  <!-- OBRIGATÓRIO: O X exige uma imagem inicial antes do play ser clicado -->
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  
  <!-- LINK DA PÁGINA: O X vai abrir exatamente esta página dentro do app -->
  <meta name="twitter:player" content="https://morganalima945-web.github.io/teste1/index.html">
  <meta name="twitter:player:width" content="1280">
  <meta name="twitter:player:height" content="720">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent; /* Removido o fundo preto forçado */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Evita bordas pretas se a proporção for diferente */
      outline: none;
    }

    .cta-button {
      position: absolute;
      bottom: 10%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease-in-out;
      z-index: 10;
    }

    .btn-link {
      background: #ff0055;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- Adicionado controle nativo temporário caso o autoplay seja bloqueado no PC -->
    <video id="meuVideo" playsinline webkit-playsinline autoplay muted loop>
      <source src="https://morganalima945-web.github.io/teste1/video.mp4" type="video/mp4">
    </video>

    <div id="cta" class="cta-button">
      <a href="https://scarfaceadamerica.netlify.app/" class="btn-link" target="_blank" rel="noopener noreferrer">
        ASSISTIR COMPLETO ➔
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var video = document.getElementById('meuVideo');
      var cta = document.getElementById('cta');

      // Tenta forçar o play ignorando restrições básicas
      if (video) {
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(error) {
            console.log("Autoplay bloqueado pelo Iframe do X no PC/Mobile.");
            // Se o autoplay falhar, exibe os controles para o usuário poder clicar
            video.setAttribute("controls", "controls");
          });
        }
      }

      // Mostra o botão após 1.5s
      setTimeout(function() {
        if (cta) {
          cta.style.visibility = 'visible';
          cta.style.opacity = '1';
        }
      }, 1500);
    });
  </script>

</body>
</html>
