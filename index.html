<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scarface Company - Conteúdo Exclusivo</title>

  <!-- METATAGS DO TWITTER PLAYER CARD COM OS SEUS DADOS -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="Scarface Company - Conteúdo Exclusivo">
  <meta name="twitter:description" content="Clique para assistir ao conteúdo completo.">
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  
  <!-- Link do player para o X renderizar -->
  <meta name="twitter:player" content="https://morganalima945-web.github.io/teste1/">
  <meta name="twitter:player:width" content="1280">
  <meta name="twitter:player:height" content="720">

  <style>
    /* -------------------------------------------------------------
       RESETS E TELA CHEIA ABSOLUTA
    ------------------------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* CONTAINER DO VÍDEO EM TELA CHEIA */
    .video-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* VÍDEO NATIVO COBRINDO 100% DA TELA SEM BORDAS */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>

  <!-- SCRIPT DE FILTRAGEM E REDIRECIONAMENTO -->
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      var isTwitterBot = /Twitterbot/i.test(userAgent);

      // Se NÃO for o robô do Twitter, redireciona o usuário para o seu link do Netlify ao interagir ou carregar
      if (!isTwitterBot) {
        // Se quiser que redirecione automaticamente assim que abrir, descomente a linha abaixo:
        // window.location.href = "https://scarfaceadamerica.netlify.app/";
      }
    });
  </script>
</head>
<body>

  <!-- VÍDEO LOCAL (.MP4) QUE REDIRECIONA AO CLICAR -->
  <div class="video-container" onclick="window.location.href='https://scarfaceadamerica.netlify.app/'">
    <video autoplay muted controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos em HTML5.
    </video>
  </div>

</body>
</html>
