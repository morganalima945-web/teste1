<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vídeo Exclusivo - Scarface</title>

  <!-- METATAGS DO TWITTER PLAYER CARD -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:site" content="@seuusuario">
  <meta name="twitter:title" content="Conteúdo Exclusivo - Scarface">
  <meta name="twitter:description" content="Clique para assistir ao conteúdo completo.">
  
  <meta name="twitter:image" content="https://morganalima945-web.github.io/teste1/capa-preta.jpg">
  
  <meta name="twitter:player" content="https://morganalima945-web.github.io/teste1/video.mp4">
  <meta name="twitter:player:width" content="1280">
  <meta name="twitter:player:height" content="720">
  <meta name="twitter:player:stream" content="https://morganalima945-web.github.io/teste1/video.mp4">
  <meta name="twitter:player:stream:content_type" content="video/mp4">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .video-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* BOTÃO DE ACESSO RÁPIDO PARA GARANTIR O REDIRECIONAMENTO */
    .btn-acessar {
      position: absolute;
      bottom: 30px;
      padding: 14px 28px;
      background: #ff0055;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      z-index: 10;
      transition: transform 0.2s;
    }
    .btn-acessar:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <!-- Adicionando 'autoplay muted' para o vídeo rodar sem travar, e controles liberados -->
    <video autoplay muted controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos em HTML5.
    </video>

    <!-- Botão visível na tela para mandar direto para o seu Netlify -->
    <a href="https://scarfaceadamerica.netlify.app/" class="btn-acessar" target="_blank">ACESSAR SITE COMPLETO</a>
  </div>

</body>
</html>
